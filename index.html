</style></head><body><main id="gate"><form class="card" id="unlock-form"><div class="mark">衣</div><h1>慢慢穿</h1><p class="intro">熟悉的衣服，新的好心情。<br>输入家人给你的访问口令，打开私人衣橱。</p><label for="password">访问口令</label><div class="entry"><input id="password" type="password" required autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="粘贴或输入口令"><button type="button" id="show-password" class="show" aria-pressed="false">显示</button></div><button class="submit" id="unlock-button">打开我的衣橱 →</button><p class="status" id="status" role="status" aria-live="polite"></p><progress id="progress" hidden></progress><p class="tip">无需注册账号。照片在解锁后才会显示。<br>首次打开需要下载图片，请稍等一会儿。关闭标签页后，下次需要重新输入口令。</p></form></main><section id="viewer" hidden><div class="toolbar"><button id="home-button">← 衣橱首页</button><button id="album-button">8 套试穿相册</button><button id="lock-button">重新上锁</button></div><iframe id="content" title="妈妈的私人衣橱" allow="clipboard-write"></iframe></section><script src="unlock.js"></script></body></html>
